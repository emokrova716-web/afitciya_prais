<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Моё желание 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: по утверждённому макету T-008. Сверху текст слева и изумрудное кольцо-портал справа, ниже блок «Колесо желаний 2027», золотые разделители. На телефоне блоки встают в столбик. Тёплый кремовый фон, тёмно-зелёный текст, золото, коралловая лента, красная кнопка. Единая светлая тема по замыслу. */
:root{
  --cream:#F6EBDD; --cream2:#F2E3D1; --paper:#FFFAF2; --ink:#22301F; --green:#294824; --emerald:#2E7A4E; --emerald-soft:#E6F0E4;
  --gold:#B8913F; --gold2:#D9B66A; --gold-soft:#F0DFB6; --muted:#6B6657; --line:#E7D7BE;
  --red:#8E1A22; --red2:#B8323A; --coral:#E07070; --danger:#8E1A22;
  --f-display:"Cormorant Garamond","Georgia","Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background:
    radial-gradient(900px 520px at 100% 0%,rgba(224,112,112,.13),transparent 62%),
    radial-gradient(700px 480px at 0% 100%,rgba(224,112,112,.10),transparent 60%),
    radial-gradient(800px 600px at 20% 10%,rgba(255,255,255,.55),transparent 60%),
    linear-gradient(180deg,#F8EEE2 0%,var(--cream) 50%,var(--cream2) 100%);
  background-color:var(--cream);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cream);z-index:10}
.app{max-width:580px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app.wide{max-width:1180px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;color:var(--green);text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(46px,11vw,84px);line-height:.98}
h2{font-size:clamp(30px,7vw,40px);line-height:1.08}
h3{font-size:25px;line-height:1.15}
p{margin:0}
ul{margin:0;padding-left:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:600}
.stack{display:grid;gap:14px}
.stack-lg{display:grid;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;min-height:40px}
.link{background:none;border:0;padding:6px 0;color:var(--emerald);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--red)}

/* главный экран по макету */
.home-hero,.home-wheel{display:grid;gap:18px;align-items:center}
.home-hero .hh-text,.home-wheel .hw-text{display:grid;gap:18px;align-content:center;min-width:0}
.home-hero p.lead,.home-wheel p.lead{font-size:clamp(17px,2.2vw,21px);line-height:1.5;color:var(--ink);max-width:30ch}
.art{width:100%;max-width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent),linear-gradient(180deg,transparent,#000 12%,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent),linear-gradient(180deg,transparent,#000 12%,#000 86%,transparent);mask-composite:intersect}
.home-hero .art{aspect-ratio:494/800;max-height:560px;width:auto;margin:0 auto}
.home-wheel .art{aspect-ratio:554/490;max-width:440px;margin:0 auto}
.divider{display:flex;align-items:center;gap:14px;color:var(--gold)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent)}
.divider span{font-size:20px;line-height:1}
.pill{display:inline-block;justify-self:start;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:8px 16px;background:linear-gradient(180deg,#F3E2B5,#E6CC8C);color:#3A2E12;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.home-wheel{border-radius:24px;padding:4px}
.storage.center{text-align:center;border-top:0}
@media (max-width:759px){
  .home-hero{grid-template-areas:"title" "art" "text"}
  .home-hero .hh-title{grid-area:title}.home-hero .art{grid-area:art;max-height:420px}.home-hero .hh-text{grid-area:text}
  .home-wheel .art{max-width:300px}
}
@media (min-width:760px){
  .home-hero{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);grid-template-areas:"title art" "text art";column-gap:40px;row-gap:20px}
  .home-hero .hh-title{grid-area:title;align-self:end}.home-hero .hh-text{grid-area:text;align-self:start}.home-hero .art{grid-area:art}
  .home-wheel{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);column-gap:40px}
}

.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(120,80,30,.06)}
.choice{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.choice:hover{border-color:var(--gold);box-shadow:0 6px 18px rgba(120,80,30,.10)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--gold-soft);color:#5E4716;vertical-align:middle}
.badge.blue{background:var(--emerald-soft);color:var(--green)}
.roads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.road{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;min-height:60px;box-shadow:0 4px 12px rgba(120,80,30,.05)}
.road:hover{border-color:var(--gold);box-shadow:0 8px 20px rgba(120,80,30,.10)}
.road .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#F3E2B5,#E2C47F);color:#3A2E12;font-weight:700;font-size:13px}
.road .nm{font-family:var(--f-display);font-weight:600;color:var(--green);font-size:20px;line-height:1.1}
.progress{height:6px;border-radius:999px;background:#EADBC4;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--gold2));border-radius:999px;transition:width .3s}
.qcount{font-size:13px;color:var(--muted);font-weight:600}
.wishquote{border-left:3px solid var(--gold);padding:8px 14px;color:var(--green);font-family:var(--f-display);font-weight:600;font-size:20px;background:rgba(240,223,182,.45);border-radius:0 12px 12px 0}
label.q{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(26px,6.6vw,32px);line-height:1.15;color:var(--green);text-wrap:balance}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;resize:vertical}
textarea{min-height:110px}
textarea:focus,input:focus{outline:2px solid var(--emerald);outline-offset:1px;border-color:transparent}
.voice{font-size:13px;color:var(--muted)}
.chips{display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;color:var(--ink)}
.chip .dot{width:18px;height:18px;border-radius:50%;border:2px solid #CDB98A;flex:none}
.chip.multi .dot{border-radius:5px}
.chip.sel{border-color:var(--emerald);background:#F3F8F1}
.chip.sel .dot{border-color:var(--emerald);background:radial-gradient(circle,var(--emerald) 45%,transparent 50%)}
.chip.multi.sel .dot{background:var(--emerald)}
.tips{display:grid;gap:8px}
.tip{background:#F7E9C9;border-radius:12px;padding:10px 12px;font-size:14px}
.preview{background:var(--paper);border:1px solid var(--gold);border-radius:16px;padding:14px 16px}
.preview .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.preview .ph{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.3;color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;border-radius:999px;padding:14px 26px;cursor:pointer;border:0;color:#FFF6EA;min-height:50px;
  background:linear-gradient(180deg,var(--red2) 0%,var(--red) 60%,#741219 100%);box-shadow:0 10px 24px rgba(142,26,34,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:hover{filter:brightness(1.06)}
a.btn{text-decoration:none}
.btn.big{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4.6vw,26px);padding:16px 38px;justify-self:start}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green);box-shadow:none}
.btn.ghost:hover{background:rgba(41,72,36,.06);filter:none}
.btn.gold{background:linear-gradient(180deg,#D9B66A,#B8913F);color:#2A220E;box-shadow:0 8px 20px rgba(184,145,63,.3)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.navrow{display:flex;gap:10px}
.navrow .btn{flex:1}
button:focus-visible,.chip:focus-visible,.home-wheel:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.verdict{border-radius:20px;padding:20px;display:grid;gap:12px}
.verdict.yes{background:linear-gradient(180deg,#EAF3E7,#FBF6EC);border:1px solid #C5DCC0}
.verdict.maybe{background:#FBF1DA;border:1px solid var(--gold-soft)}
.verdict.not{background:#F9EAE6;border:1px solid #EBC9C2}
.verdict h2{font-size:clamp(26px,6.4vw,32px)}
.result-card{background:var(--paper);border:1px solid var(--gold);border-radius:22px;padding:20px;position:relative;box-shadow:0 12px 30px rgba(120,80,30,.08)}
.result-card::after{content:"";position:absolute;inset:6px;border:1px solid var(--gold-soft);border-radius:17px;pointer-events:none}
.result-card textarea{min-height:130px;font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.3;color:var(--green);position:relative;z-index:1}
.confirmed{color:var(--green);font-weight:600}
.note{background:var(--emerald-soft);border-radius:14px;padding:14px 16px}
.storage{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.wheelimg{width:100%;max-width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;display:block}
.keys-grid{display:grid;gap:22px}
.wheelcol{display:grid;gap:14px;align-content:start}
@media (min-width:900px){
  .keys-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:start}
  .wheelcol{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.entry.filled{border-color:var(--gold)}
.entry .head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.entry .ph{font-family:var(--f-display);font-weight:600;color:var(--green);font-size:20px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 18px;border-radius:999px;font-size:14.5px;z-index:40;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(40,30,15,.45);display:grid;place-items:center;z-index:30;padding:16px}
.modal .box{background:var(--paper);border-radius:20px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px;max-height:90vh;overflow:auto}
.fade{animation:fade .28s ease-out}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
#printArea{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .app,.toast,.modal,body::before{display:none!important}
  #printArea{display:block!important;color:#22301F;font-family:var(--f-body)}
  #printArea h1{font-family:var(--f-display);color:#294824;font-size:32px;margin:0 0 4px}
  #printArea .pa-sub{color:#B8913F;letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-bottom:14px}
  #printArea .pa-wish{font-family:var(--f-display);font-weight:600;color:#294824;font-size:26px;line-height:1.35;border:1px solid #B8913F;border-radius:12px;padding:18px 20px;margin-bottom:12px}
  #printArea img{width:100%;max-width:170mm;display:block;margin:0 auto 12px}
  #printArea .pa-box{border:1px solid #D9C391;border-radius:10px;padding:10px 14px;margin-bottom:8px;break-inside:avoid}
  #printArea .pa-box h3{font-family:var(--f-display);color:#294824;margin:0 0 4px;font-size:17px}
  #printArea .pa-box p{white-space:pre-wrap;margin:0;font-size:13px;line-height:1.45}
  #printArea .pa-foot{margin-top:14px;font-size:11px;color:#6B6657}
  .pa-break{break-before:page}
}
.cta-card{background:var(--paper);border:1px solid var(--gold);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(120,80,30,.06)}
.cta-card .btn{justify-self:start}
.cta-t{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.2;color:var(--green)}
.author{display:grid;gap:10px;justify-items:center;text-align:center}
.author a{color:var(--emerald);font-weight:600}
.ava{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid var(--gold2)}
.a-name{font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--green)}
.soc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.soc a{text-decoration:none;border:1.5px solid var(--green);border-radius:999px;padding:9px 16px;font-size:14.5px}
</style>

</head><body>
<main class="app" id="app" aria-live="polite"></main>
<div id="printArea"></div>

<script>
/* ================== 12 жизненных дорог «Ключей от 2027» ==================
   Перечень и порядок переданы Еленой 06.11.2026. Подсказки и примеры ниже
   написаны для этого инструмента и могут быть заменены на авторские. */
const ROADS = [
  {title:"Здоровье", wishEx:"хочу больше сил и бодрости",
   why:"Зачем тебе это? Что ты будешь делать, когда сил и здоровья станет достаточно?",
   resEx:"У меня достаточно сил на работу, прогулки и близких", measure:"Например: сплю по 8 часов, гуляю каждый день. Если цифры не нужны, пропусти.",
   hint:"Пиши о самочувствии и привычках. Это желание, не медицинский план."},
  {title:"Материальные блага", wishEx:"хочу больше денег",
   why:"На что тебе эти деньги или вещи? Что они тебе дадут?",
   resEx:"Мой доход составляет 500 000 рублей в месяц и выше", measure:"Сумма, вещь, жильё: то, что можно увидеть или посчитать.",
   hint:"Здесь цифры уместны: сумма, срок, конкретная вещь."},
  {title:"Карьера", wishEx:"хочу стать начальником отдела",
   why:"Зачем тебе эта должность или работа? Что она тебе даст: доход, уважение, интересные задачи, влияние?",
   resEx:"Я руковожу отделом из шести человек в своей компании", measure:"Должность, доход, формат, город, задачи.",
   hint:"Если главное для тебя доход или признание, у них есть свои дороги: «Материальные блага» и «Признание»."},
  {title:"Признание", wishEx:"хочу, чтобы меня знали",
   why:"Что изменится, когда тебя узнают и оценят? Чьё признание тебе важно?",
   resEx:"Меня знают и ценят как специалиста по свечной магии", measure:"Например: отзывы, выступления, число учеников. Можно без цифр.",
   hint:"Пиши о себе и своём деле. Чужие мнения не требуем, описываем, как это выглядит."},
  {title:"Дружба", wishEx:"хочу близких подруг",
   why:"Что для тебя значит настоящая дружба? Чего тебе сейчас не хватает?",
   resEx:"Рядом со мной есть подруги, с которыми я могу быть собой", measure:"Числа здесь не обязательны.",
   hint:"Пиши про свою жизнь и свои отношения, без требований к конкретному человеку."},
  {title:"Любовь", wishEx:"хочу встретить любимого человека",
   why:"Что для тебя главное в любви? Каким ты хочешь чувствовать себя рядом с любимым?",
   resEx:"Я в отношениях, где меня любят и я люблю, рядом с ним мне спокойно", measure:"Любовь не обязательно измерять. Можно описать, как это ощущается.",
   hint:"Пиши о себе и своих отношениях. Управлять чувствами и решениями конкретного человека мы не просим."},
  {title:"Семья и брак", wishEx:"хочу, чтобы в семье было спокойно",
   why:"Какой ты хочешь видеть свою семью? Что для тебя в ней главное?",
   resEx:"В нашей семье тепло и спокойно, по вечерам мы ужинаем вместе", measure:"Можно описать конкретную картинку из жизни.",
   hint:"Пиши про свою часть и своё участие. Решения других людей остаются за ними."},
  {title:"Дети", wishEx:"хочу больше времени с ребёнком",
   why:"Что тебе важно в отношениях с детьми или в желании стать мамой?",
   resEx:"У меня с сыном доверительные отношения, он делится со мной своими делами", measure:"Можно описать, как это выглядит в обычный день.",
   hint:"Пиши о себе и своих отношениях с детьми. Выбор ребёнка остаётся за ним."},
  {title:"Творчество", wishEx:"хочу снова рисовать",
   why:"Зачем тебе творчество? Что ты чувствуешь, когда создаёшь?",
   resEx:"Я рисую каждую неделю и показываю свои работы людям", measure:"Например: сколько работ, где показываешь. Можно без цифр.",
   hint:"Пиши, чем именно ты занимаешься и как это выглядит."},
  {title:"Предназначение", wishEx:"хочу найти своё дело",
   why:"Как ты поймёшь, что занимаешься своим делом? Что в нём для тебя главное?",
   resEx:"Я занимаюсь делом, в котором чувствую себя на своём месте", measure:"Можно назвать дело, людей, для кого ты это делаешь.",
   hint:"Если пока не знаешь, какое дело, опиши ощущение и признаки."},
  {title:"Свобода", wishEx:"хочу больше свободы",
   why:"Свобода от чего и для чего? Что ты будешь делать, когда она появится?",
   resEx:"Я сама решаю, как распоряжаться своим временем и деньгами", measure:"Например: свободные дни, путешествия, формат работы.",
   hint:"Пиши, что именно становится свободным в твоей жизни."},
  {title:"Духовность", wishEx:"хочу больше гармонии внутри",
   why:"Что для тебя духовность? Что изменится внутри тебя?",
   resEx:"У меня есть практика, которая меня наполняет, и я возвращаюсь к ней каждый день", measure:"Числа не обязательны. Можно описать практику или состояние.",
   hint:"Пиши о своём состоянии и своей практике."}

const TRUTH = [
  {id:"feel", text:"Представь, что желание уже сбылось. Что ты чувствуешь?", options:[
    {v:"joy",label:"Радость, лёгкость, тепло",s:2,pos:"представляешь его и чувствуешь радость и лёгкость"},
    {v:"calm",label:"Спокойствие, «наконец-то»",s:2,pos:"чувствуешь спокойствие, когда представляешь его"},
    {v:"flat",label:"Ничего особенного",s:0,neg:"особых чувств оно пока не вызывает"},
    {v:"tense",label:"Напряжение, тревогу или «надо»",s:-2,neg:"оно вызывает скорее напряжение или чувство «надо»",hard:true}]},
  {id:"see", text:"Ты видишь себя в этой картинке? Можешь представить, как это выглядит в твоей обычной жизни?", options:[
    {v:"clear",label:"Да, вижу ясно",s:2,pos:"ясно видишь себя в нём"},
    {v:"vague",label:"Вижу, но смутно",s:1,pos:"видишь себя в нём, пусть пока смутно"},
    {v:"no",label:"Не получается представить",s:-1,neg:"пока не получается увидеть себя в нём"}]},
  {id:"whom", text:"Для кого это желание?", options:[
    {v:"self",label:"Для себя",s:2,pos:"хочешь его для себя"},
    {v:"both",label:"И для себя, и для близких",s:1,pos:"хочешь его для себя и для близких"},
    {v:"approve",label:"Скорее чтобы кто-то оценил или одобрил",s:-2,neg:"оно скорее для того, чтобы кто-то оценил или одобрил",hard:true},
    {v:"must",label:"Так принято, так надо",s:-2,neg:"оно скорее про «так принято, так надо»",hard:true}]},
  {id:"why", type:"text"},
  {id:"keep", text:"Представь, что то, ради чего это желание, пришло в твою жизнь другим путём. Тебе всё равно нужно именно это?", options:[
    {v:"yes",label:"Да, мне важно именно это",s:2,pos:"тебе важно именно это, а не только то, что оно даст"},
    {v:"deeper",label:"Нет, мне важнее то, ради чего",s:0,neg:"тебе важнее то, ради чего оно"},
    {v:"unsure",label:"Пока не знаю",s:0}]}
];
function verdictOf(a){
  let score=0,pos=[],neg=[],hard=false;
  TRUTH.forEach(q=>{ if(!q.options) return; const o=q.options.find(x=>x.v===a[q.id]); if(!o) return;
    score+=o.s; if(o.pos) pos.push(o.pos); if(o.neg) neg.push(o.neg); if(o.hard) hard=true; });
  const kind = hard ? "not" : (score>=6 && !neg.length ? "yes" : "maybe");
  return {kind,pos,neg,deeper:a.keep==="deeper"};
}

/* ---------- хранилище ---------- */
const emptyStore = () => ({gift:null, keys:{slots:Array.from({length:12},()=>({text:"",confirmedAt:null}))}});
let store = emptyStore(), storageOk=true;
function load(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw){const d=JSON.parse(raw); if(d&&d.keys&&Array.isArray(d.keys.slots)&&d.keys.slots.length===12) store=d;} }catch(e){ storageOk=false; } }
function save(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(store)); storageOk=true; }catch(e){ storageOk=false; } }
function wipe(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} store=emptyStore(); }

function confirmBox(title,text,ok,onOk){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="navrow"><button class="btn ghost" data-x>Отмена</button><button class="btn" data-ok>${esc(ok)}</button></div></div>`;
  m.querySelector("[data-x]").onclick=()=>m.remove(); m.querySelector("[data-ok]").onclick=()=>{m.remove();onOk();};
  m.onclick=e=>{if(e.target===m)m.remove();}; document.body.appendChild(m);
}
const storageLine=()=>storageOk
 ? `Всё, что ты пишешь, хранится только в этом браузере на этом устройстве и никуда не отправляется. <button class="link danger" data-wipe>Удалить мои данные</button>`
 : `Этот браузер не даёт сохранять данные (например, в приватном режиме). Скопируй или скачай желание, чтобы оно не потерялось.`;
function bindWipe(){const b=$app.querySelector("[data-wipe]");if(b)b.onclick=()=>confirmBox("Удалить твои данные?","Желание и колесо желаний сотрутся из этого браузера. Вернуть их будет нельзя.","Удалить",()=>{wipe();flow=null;view={name:"home"};render();toast("Данные удалены");});}
function topbar(label,right=""){return `<div class="topbar"><button class="link" data-back>‹ ${esc(label)}</button>${right}</div>`;}
function bindBack(fn){const b=$app.querySelector("[data-back]");if(b)b.onclick=fn;}

/* ---------- шаги сценария ---------- */
// wish → feel → see → whom → why → keep → verdict → date → result → measure → how → final
const STEPS=["wish","feel","see","whom","why","keep","verdict","date","result","measure","how","final"];
const QSTEPS=STEPS.filter(s=>s!=="verdict"&&s!=="final");
function startFlow(mode,road,slot){
  const prev = mode==="slot" ? store.keys.slots[slot] : null;
  flow={mode,road,slot,step:0,wish:(prev&&prev.wish)||"",a:(prev&&prev.a)?{...prev.a}:{},b:(prev&&prev.b)?{...prev.b,how:[...(prev.b.how||[])]}:{how:[]},text:"",confirmedAt:null};
  view={name:"flow"};render();
}
function go(step){flow.step=STEPS.indexOf(step);render();}
function next(){flow.step++;render();}
function back(){
  if(flow.step===0){view={name:flow.mode==="gift"?"roads":"keys"};render();return;}
  flow.step--;render();
}

function render(){
  const v=view.name; $app.classList.toggle("wide",v==="keys"||v==="home");
  if(v==="home")renderHome(); else if(v==="roads")renderRoads(); else if(v==="flow")renderFlow();
  else if(v==="keys")renderKeys(); else if(v==="quick")renderQuick();
  window.scrollTo({top:0});
}

function header(){

function chipsHTML(opts,val,multi){
  return `<div class="chips">${opts.map(o=>{const sel=multi?val.includes(o.v):val===o.v;return `<button class="chip ${multi?"multi":""} ${sel?"sel":""}" role="${multi?"checkbox":"radio"}" aria-checked="${sel}" data-v="${esc(o.v)}"><span class="dot"></span><span>${esc(o.label)}</span></button>`;}).join("")}</div>`;

/* ---------- сборка фразы ---------- */
function dateText(b){
  const d=DATES.find(x=>x.v===b.date); if(!d) return "";
  if(d.v==="own") return ucFirst(clean(b.dateOwn));
  return d.text;
}
function composeWish(b){
  let core=clean(b.result); if(!core) return "";
  const m=clean(b.measure); if(m) core+=", "+lcFirst(m);
  const how=(b.how||[]).map(x=>x==="own"?clean(b.howOwn):x).filter(Boolean);
  if(how.length) core+=", "+joinRu(how);
  const d=dateText(b);
  return (d? d+" "+lcFirst(core) : ucFirst(core))+".";
}
function resultTips(t,road){
  const s=" "+t.toLowerCase().replace(/[.,!?;:«»"()]/g," ")+" ", tips=[];
  if(/\s(хочу|хотела бы|хочется|мечтаю)\s/.test(s)) tips.push("Опиши так, будто это уже есть. Вместо «хочу…» напиши, как это выглядит сейчас.");
  if(/\s(буду|будет|будут|стану|станет|постараюсь|попробую|смогу)\s/.test(s)) tips.push("Попробуй настоящее время: «я руковожу», «у меня есть», «мой доход составляет».");
  if(/\sне\s/.test(s)) tips.push("Если получится, опиши, что есть вместо этого. Например, вместо «не устаю» можно «у меня достаточно сил на…». Это подсказка, не правило.");
  if(t.trim() && !/^\s(я|у меня|в моей|в нашей|мой|моя|моё|мое|мои|меня|мне|мы|наш|наша|наше|рядом со мной|со мной)\s/.test(s)) tips.push("Можно начать от себя: «Я…», «У меня…», «В моей жизни…».");
  return tips;
}

      ${chipsHTML(DATES.map(d=>({v:d.v,label:d.label})),f.b.date)}

    };
  }else if(s==="result"){
    html=`<div class="stack"><div class="eyebrow">Собираем формулировку</div><label class="q" for="ta">Как это выглядит, когда уже сбылось?</label>
      <p class="muted small">Напиши от себя и в настоящем времени, как будто это уже есть. Один главный смысл. ${esc(R.hint)}</p></div>
      <textarea id="ta" placeholder="Например: ${esc(R.resEx)}">${esc(f.b.result||"")}</textarea>${VOICE}

      <input type="text" id="ta" value="${esc(f.b.measure||"")}" placeholder="Например: в своём городе, с командой, которая мне нравится">${VOICE}

function renderVerdict(){
  const f=flow, v=verdictOf(f.a);
  const T={yes:"Похоже, это твоё истинное желание",maybe:"Похоже, это твоё желание, но в нём есть сомнения",not:"Похоже, это пока не совсем твоё желание"}[v.kind];
  const posBlock=v.pos.length?`<div><p><b>${v.kind==="not"?"Что в нём твоё:":"Потому что ты"}</b></p><ul>${v.pos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const negBlock=v.neg.length?`<div><p><b>${v.kind==="not"?"Что на это указывает:":"Что смущает:"}</b></p><ul>${v.neg.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const deeper=v.deeper&&clean(f.a.why)?`<div class="note"><p>Ты написала, ради чего это желание: «${esc(clean(f.a.why))}». Можно сформулировать желание прямо через это.</p></div>`:"";
  $app.innerHTML=`<div class="stack-lg fade">${topbar("Назад")}
    <div class="wishquote">${esc(clean(f.wish))}</div>
    <section class="verdict ${v.kind}"><div class="eyebrow">Вывод по твоим ответам</div><h2>${T}</h2>${v.kind==="not"?negBlock+posBlock:posBlock+negBlock}
      <p class="muted small">Это подсказка по твоим ответам. Решаешь ты.</p></section>
    ${deeper}
    <button class="btn wide" data-keep>${v.kind==="not"?"Всё равно оставить и сформулировать":"Сформулировать это желание"}</button>
    <button class="btn ghost wide" data-rewrite>Переписать желание</button></div>`;
  $app.querySelector("[data-keep]").onclick=()=>go("date");
  $app.querySelector("[data-rewrite]").onclick=()=>{
    const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="box"><h3>Как звучит твоё желание теперь?</h3>${v.deeper&&clean(f.a.why)?`<p class="muted small">Подсказка, твой ответ: «${esc(clean(f.a.why))}»</p>`:""}<textarea id="rw">${esc(f.wish)}</textarea>${VOICE}<div class="navrow"><button class="btn ghost" data-x>Отмена</button><button class="btn" data-ok>Проверить заново</button></div></div>`;
    m.querySelector("[data-x]").onclick=()=>m.remove();
    m.querySelector("[data-ok]").onclick=()=>{const t=m.querySelector("#rw").value;if(!clean(t))return;f.wish=t;["feel","see","whom","keep"].forEach(k=>delete f.a[k]);m.remove();go("feel");};
    document.body.appendChild(m);
  };
  bindBack(back);
}

function finish(){ flow.text=composeWish(flow.b); flow.confirmedAt=null; persist(); go("final"); }
function persist(){
  const f=flow, rec={road:f.road,wish:f.wish,a:f.a,b:f.b,text:f.text,confirmedAt:f.confirmedAt||null,updatedAt:new Date().toISOString()};

}

    <textarea id="ta" placeholder="Например: ${esc(R.resEx)}">${esc(s.text)}</textarea>${VOICE}<div class="tips" id="tips"></div>
    <div class="navrow"><button class="btn ghost" data-clear>Очистить</button><button class="btn" data-ok>Сохранить</button></div></div>`;
  const t=$app.querySelector("#ta"); const upd=()=>{$app.querySelector("#tips").innerHTML=resultTips(t.value,R).map(x=>`<div class="tip">${esc(x)}</div>`).join("");}; t.oninput=upd; upd();
  $app.querySelector("[data-ok]").onclick=()=>{store.keys.slots[i]={...s,text:t.value,confirmedAt:clean(t.value)?new Date().toISOString():null};save();view={name:"keys"};render();toast("Сохранено");};
  $app.querySelector("[data-clear]").onclick=()=>{t.value="";upd();t.focus();};
  bindBack(()=>{view={name:"keys"};render();});
}
function wheelText(){const S=store.keys.slots;return "КОЛЕСО ЖЕЛАНИЙ 2027\n\n"+ROADS.map((r,i)=>`${i+1}. ${r.title}\n${clean(S[i].text)?S[i].text.trim():"пока пусто"}`).join("\n\n")+`\n\n${BRAND}\n`;}

/* ---------- отрисовка ---------- */
async function fontsReady(){try{await Promise.all([document.fonts.load("600 40px 'Cormorant Garamond'"),document.fonts.load("500 28px 'Golos Text'"),document.fonts.load("700 20px 'Golos Text'")]);}catch(e){}}
function wrap(ctx,text,maxW){const out=[];text=String(text).replace(/(\d) (?=\d{3}(?!\d))/g,"$1\u00A0");for(const para of text.split("\n")){if(!para.trim()){continue;}let line="";for(const w of para.split(/[ \t]+/)){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);}return out;}
async function drawWheel(){
  await fontsReady();
  const S=store.keys.slots, N=12, W=2000, H=2000, cx=W/2, cy=H/2-10, R=900, r0=240;
  const c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
  const bg=ctx.createRadialGradient(cx,cy,R*0.6,cx,cy,W*0.75);bg.addColorStop(0,"#FAF1E6");bg.addColorStop(1,"#EFDCC6");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // тень под колесом
  ctx.save();ctx.shadowColor="rgba(110,70,25,.30)";ctx.shadowBlur=70;ctx.shadowOffsetY=34;
  ctx.beginPath();ctx.arc(cx,cy,R+34,0,2*Math.PI);ctx.fillStyle="#9C7630";ctx.fill();ctx.restore();
  // золотой обод с бликом
  const rim=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  rim.addColorStop(0,"#F3DE9C");rim.addColorStop(.35,"#B8913F");rim.addColorStop(.6,"#E9CD84");rim.addColorStop(1,"#8A6424");
  ctx.beginPath();ctx.arc(cx,cy,R+34,0,2*Math.PI);ctx.fillStyle=rim;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,R+6,0,2*Math.PI);ctx.fillStyle="#7A5A22";ctx.fill();
  const step=2*Math.PI/N, start=-Math.PI/2-step/2;
  for(let i=0;i<N;i++){
    const a0=start+i*step,a1=a0+step,has=!!clean(S[i].text);
    const sg=ctx.createRadialGradient(cx,cy,r0,cx,cy,R);
    if(has){sg.addColorStop(0,"#F2E2B4");sg.addColorStop(.55,i%2?"#FBF1D8":"#FDF5E2");sg.addColorStop(1,"#FFFBF1");}
    else{sg.addColorStop(0,"#EFE6D8");sg.addColorStop(.55,i%2?"#FBF7F0":"#FFFCF6");sg.addColorStop(1,"#FFFFFC");}
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();ctx.fillStyle=sg;ctx.fill();
    ctx.strokeStyle="#C9A65E";ctx.lineWidth=3;ctx.stroke();
  }
  // внутренняя тень по краю, чтобы колесо было вогнутым
  const ish=ctx.createRadialGradient(cx,cy,R*0.86,cx,cy,R);ish.addColorStop(0,"rgba(140,100,40,0)");ish.addColorStop(1,"rgba(140,100,40,.16)");
  ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);ctx.fillStyle=ish;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,R-16,0,2*Math.PI);ctx.lineWidth=2;ctx.strokeStyle="rgba(201,166,94,.8)";ctx.stroke();
  // центр: медальон со свечением
  ctx.save();ctx.shadowColor="rgba(240,210,140,.9)";ctx.shadowBlur=60;
  ctx.beginPath();ctx.arc(cx,cy,r0+14,0,2*Math.PI);ctx.fillStyle=rim;ctx.fill();ctx.restore();
  const g=ctx.createRadialGradient(cx-60,cy-80,20,cx,cy,r0);g.addColorStop(0,"#FFFDF7");g.addColorStop(.7,"#F7ECD6");g.addColorStop(1,"#E9D3A6");
  ctx.beginPath();ctx.arc(cx,cy,r0,0,2*Math.PI);ctx.fillStyle=g;ctx.fill();
  const gl=ctx.createLinearGradient(cx,cy-r0,cx,cy);gl.addColorStop(0,"rgba(255,255,255,.18)");gl.addColorStop(1,"rgba(255,255,255,0)");
  ctx.beginPath();ctx.ellipse(cx,cy-r0*0.45,r0*0.78,r0*0.48,0,0,2*Math.PI);ctx.fillStyle=gl;ctx.fill();
  const star=(x,y,r)=>{ctx.beginPath();for(let k=0;k<8;k++){const an=k*Math.PI/4-Math.PI/2,rr=k%2?r*.22:r;ctx.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr);}ctx.closePath();const sg2=ctx.createLinearGradient(x-r,y-r,x+r,y+r);sg2.addColorStop(0,"#F6DE98");sg2.addColorStop(1,"#A87E2E");ctx.fillStyle=sg2;ctx.fill();};
  star(cx,cy-112,30);
  ctx.textAlign="center";ctx.fillStyle="#294824";ctx.font="700 28px 'Golos Text', sans-serif";ctx.fillText("КОЛЕСО ЖЕЛАНИЙ",cx,cy-48);
  ctx.save();ctx.shadowColor="rgba(120,80,30,.25)";ctx.shadowBlur=10;ctx.shadowOffsetY=3;
  ctx.fillStyle="#294824";ctx.font="600 136px 'Cormorant Garamond', serif";ctx.fillText("2027",cx,cy+72);ctx.restore();
  ctx.fillStyle="#B8913F";ctx.font="500 24px 'Golos Text', sans-serif";ctx.fillText("Elena Afitciya",cx,cy+140);
  // тексты секторов
  for(let i=0;i<N;i++){
    const mid=start+(i+.5)*step, s=S[i], has=!!clean(s.text);
    const arcText=(txt,rad,font,color)=>{ctx.save();ctx.translate(cx+Math.cos(mid)*rad,cy+Math.sin(mid)*rad);let rot=mid+Math.PI/2;if(Math.sin(mid)>0.01)rot+=Math.PI;ctx.rotate(rot);ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=font;ctx.fillStyle=color;ctx.fillText(txt,0,0);ctx.restore();};
    arcText(String(i+1),R*0.925,"700 28px 'Golos Text', sans-serif","#B8913F");
    let nf=46; ctx.font="600 "+nf+"px 'Cormorant Garamond', serif"; while(ctx.measureText(ROADS[i].title).width>R*0.84*0.46&&nf>28){nf-=2;ctx.font="600 "+nf+"px 'Cormorant Garamond', serif";}
    arcText(ROADS[i].title,R*0.835,"600 "+nf+"px 'Cormorant Garamond', serif","#294824");
    ctx.textBaseline="alphabetic";
    // желание
    const wx=cx+Math.cos(mid)*(R*0.55), wy=cy+Math.sin(mid)*(R*0.55);
    const boxW=215, boxH=230;
    if(has){
      let size=26,lines;
      do{ctx.font=`500 ${size}px 'Golos Text', sans-serif`;lines=wrap(ctx,s.text.trim(),boxW);size-=1;}while(lines.length*size*1.3>boxH&&size>16);
      size+=1; const lh=Math.round(size*1.3);
      const maxL=Math.floor(boxH/lh); if(lines.length>maxL){lines=lines.slice(0,maxL);lines[maxL-1]=lines[maxL-1].replace(/\s*\S*$/,"")+"…";}
      ctx.fillStyle="#22301F";
      lines.forEach((l,k)=>ctx.fillText(l,wx,wy+k*lh-(lines.length-1)*lh/2+size*0.35));
    }else{
      ctx.fillStyle="#A59C88";ctx.font="400 24px 'Golos Text', sans-serif";ctx.fillText("место для",wx,wy-12);ctx.fillText("желания",wx,wy+18);
    }
  }
  return c;
}
async function downloadCard(title,text,confirmed){
  await fontsReady();
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#FBF5EA");g.addColorStop(1,"#F3EAD9");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#B8913F";ctx.lineWidth=3;ctx.strokeRect(44,44,W-88,H-88);ctx.lineWidth=1.2;ctx.strokeStyle="#D9C391";ctx.strokeRect(60,60,W-120,H-120);
  ctx.textAlign="center";ctx.fillStyle="#B8913F";ctx.font="700 24px 'Golos Text', sans-serif";ctx.fillText("ГОРОДСКАЯ МАГИЯ",W/2,150);
  ctx.fillStyle="#294824";ctx.font="76px 'Cormorant Garamond', serif";ctx.fillText("Моё желание 2027",W/2,250);
  ctx.fillStyle="#6B6657";ctx.font="500 28px 'Golos Text', sans-serif";ctx.fillText(title,W/2,306);
  ctx.strokeStyle="#D9C391";ctx.beginPath();ctx.moveTo(W/2-160,340);ctx.lineTo(W/2+160,340);ctx.stroke();
  let size=56,lines;do{ctx.font=`${size}px 'Cormorant Garamond', serif`;lines=wrap(ctx,text.trim(),W-260);size-=2;}while(lines.length*size*1.4>H-640&&size>26);size+=2;
  const lh=Math.round(size*1.4),total=lines.length*lh;let y=(H+280-total)/2;
  ctx.fillStyle="#294824";for(const l of lines){ctx.fillText(l,W/2,y+size);y+=lh;}
  if(confirmed){ctx.fillStyle="#B8913F";ctx.font="32px 'Cormorant Garamond', serif";ctx.fillText("✦ Это моё желание ✦",W/2,H-170);}
  ctx.fillStyle="#6B6657";ctx.font="400 22px 'Golos Text', sans-serif";ctx.fillText(BRAND,W/2,H-110);
  c.toBlob(b=>downloadBlob(b,"moe-zhelanie-2027.png"),"image/png");
}

/* ---------- экспорт ---------- */
let dl=null;(async()=>{try{if(inArtifact)dl=await window.claude.use("downloads");}catch(e){dl=null;}})();
async function downloadBlob(blob,filename){
  if(dl){try{await dl.save({filename,data:blob});toast("Файл сохранён");return;}catch(e){if(e&&e.code==="declined"){toast("Сохранение отменено");return;}}}
  try{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Файл скачивается");}catch(e){toast("Не получилось скачать. Скопируй текст.");}
}
function copyText(t){const done=()=>toast("Скопировано");const fb=()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("Выдели текст и скопируй вручную");}ta.remove();};try{navigator.clipboard.writeText(t).then(done,fb);}catch(e){fb();}}
function printWish(title,text){
  document.getElementById("printArea").innerHTML=`<div class="pa-sub">${esc(BRAND)}</div><h1>Моё желание 2027</h1><p style="color:#676C80;margin:0 0 12px">${esc(title)}</p><div class="pa-wish">${esc(text)}</div><div class="pa-foot">Сформулировано ${new Date().toLocaleDateString("ru-RU")}</div>`;
  window.print();
}
async function printWheel(){
  const c=await drawWheel(), S=store.keys.slots;
  document.getElementById("printArea").innerHTML=`<div class="pa-sub">${esc(BRAND)}</div><h1>Колесо желаний 2027</h1><img src="${c.toDataURL("image/png")}" alt="">
   <div class="pa-break"></div><h1>Блокнот желаний</h1>${ROADS.map((r,i)=>`<div class="pa-box"><h3>${i+1}. ${esc(r.title)}</h3><p>${esc(clean(S[i].text)?S[i].text:"пока пусто")}</p></div>`).join("")}`;
  setTimeout(()=>window.print(),60);
}
