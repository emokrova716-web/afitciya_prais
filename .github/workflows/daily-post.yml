name: Знак дня в Telegram

on:
  schedule:
    - cron: "30 23 * * *"  # 02:30 МСК
    - cron: "45 23 * * *"  # 02:45 МСК, резерв при задержке
    # Повторной публикации не будет: post.py проверяет daily/posted.log
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Опубликовать карточку на сегодня
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "$(TZ=Europe/Moscow date +%H%M)" < "0230" ]]; then
            echo "Отправка разрешена с 02:30 МСК"
            exit 0
          fi
          python3 daily/post.py
      - name: Запомнить, что опубликовано
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add daily/posted.log || true
          git diff --cached --quiet || (git commit -m "Опубликован знак дня" && git push)
