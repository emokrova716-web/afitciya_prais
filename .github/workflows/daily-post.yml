name: Знак дня в Telegram

on:
  schedule:
    - cron: "41 2 * * *"   # 05:41 по Москве
    - cron: "7 3 * * *"    # 06:07, запасной запуск (GitHub иногда пропускает расписание)
    - cron: "37 3 * * *"   # 06:37, запасной
    - cron: "13 4 * * *"   # 07:13, запасной
    # Повторной публикации не будет: post.py проверяет daily/posted.log
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Опубликовать карточку на сегодня
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python3 daily/post.py
      - name: Запомнить, что опубликовано
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add daily/posted.log || true
          git diff --cached --quiet || (git commit -m "Опубликован знак дня" && git push)
